version: '3'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev

  realtime:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: npm run start:realtime
    ports:
      - 8080:8080
    environment:
      - PORT=8080
      - ALLOWED_ORIGINS=http://localhost:3000
